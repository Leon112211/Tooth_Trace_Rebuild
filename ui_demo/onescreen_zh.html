<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>上颌咬合力监测</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: 手机单屏 —— 摘要 → 上颌咬合面热力图（占满剩余高度）→ 色标 → 控制 → 传感器列表；桌面端套手机外框 */
:root {
  --bg: #dfe6e8;
  --app: #f3f6f7;
  --surface: #ffffff;
  --fg: #132127;
  --muted: #5a6b72;
  --line: #d4dde0;
  --accent: #0d6f7a;
  --accent-soft: #d9eef0;
  --frame: #1a2327;
  --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #070c0e; --app: #0e161a; --surface: #152025; --fg: #e1eaec; --muted: #8b9da3;
    --line: #253339; --accent: #4cbcc6; --accent-soft: #143238; --frame: #000000;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #070c0e; --app: #0e161a; --surface: #152025; --fg: #e1eaec; --muted: #8b9da3;
  --line: #253339; --accent: #4cbcc6; --accent-soft: #143238; --frame: #000000;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.5;
  padding-block: 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

/* 手机外框（仅宽屏） */
.device {
  position: relative;
  width: 390px;
  max-width: 100%;
  height: 830px;
  border: 11px solid var(--frame);
  border-radius: 48px;
  background: var(--app);
  overflow: hidden;
  box-shadow: 0 30px 60px -20px rgba(10, 30, 36, .45), 0 0 0 1px rgba(255,255,255,.06) inset;
}
.notch {
  position: absolute; top: 9px; left: 50%; transform: translateX(-50%);
  width: 96px; height: 26px; border-radius: 14px; background: var(--frame); z-index: 3;
}
.screen { height: 100%; overflow-y: auto; scrollbar-width: thin; }
.statusbar {
  height: 44px; padding: 12px 26px 0; display: flex; justify-content: space-between;
  font: 600 13px/1 var(--font-data); color: var(--fg);
}
.statusbar .sig { display: flex; gap: 6px; align-items: center; }
.batt { width: 22px; height: 11px; border: 1.5px solid currentColor; border-radius: 3px; position: relative; }
.batt::after { content: ""; position: absolute; inset: 1.5px 6px 1.5px 1.5px; background: currentColor; border-radius: 1px; }
.app { padding: 6px 16px 28px; display: flex; flex-direction: column; gap: 14px; }

@media (max-width: 559px) {
  body { padding-block: 12px; }
  .device { width: 100%; height: auto; border: 0; border-radius: 0; box-shadow: none; background: transparent; overflow: visible; }
  .notch, .statusbar { display: none; }
  .screen { overflow: visible; height: auto; }
  .app { padding: 0 0 24px; }
}

/* 头部 */
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.head h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: .02em; text-wrap: balance; }
.head .sub { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent);
  font-size: 12px; font-weight: 500;
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 1.6s ease-in-out infinite; }
.chip.paused .dot { animation: none; opacity: .45; }
@keyframes pulse { 50% { opacity: .25; } }

/* 摘要 */
.summary { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 10px 9px; min-width: 0; }
.stat .k { font-size: 11px; color: var(--muted); letter-spacing: .04em; }
.stat .v { font: 600 20px/1.25 var(--font-data); font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat .v small { font-size: 11px; font-weight: 500; color: var(--muted); margin-left: 2px; }
.stat .v.sm { font-size: 15px; line-height: 1.6; }
.balance { margin-top: 6px; height: 5px; border-radius: 3px; background: var(--line); display: flex; overflow: hidden; }
.balance i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.balance i + i { background: var(--muted); opacity: .55; }

/* 牙弓卡片 */
.arch-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card-head h2 { margin: 0; font-size: 14px; font-weight: 700; }
.stage { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.stage b { color: var(--fg); font-weight: 500; }
svg.arch { width: 100%; height: auto; display: block; }
svg .lbl { font: 600 24px var(--font-data); fill: var(--fg); }
svg .side { font: 500 24px var(--font-body); fill: var(--muted); }
.sensor { cursor: pointer; outline: none; }
.sensor .ring { fill: none; stroke: var(--accent); stroke-width: 4; opacity: 0; }
.sensor.sel .ring { opacity: 1; }
.sensor:focus-visible .ring { opacity: 1; stroke-dasharray: 7 7; }
.info {
  min-height: 40px; padding: 8px 10px; border-radius: 10px; background: var(--app);
  font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.info b { color: var(--fg); font-weight: 500; }
.info .num { font-family: var(--font-data); color: var(--fg); font-variant-numeric: tabular-nums; }

/* 色标 */
.scale { display: flex; flex-direction: column; gap: 4px; padding: 0 2px; }
.scale .bar { height: 10px; border-radius: 5px; }
.scale .ticks { display: flex; justify-content: space-between; font: 10.5px var(--font-data); color: var(--muted); }
.scale .cap { font-size: 11px; color: var(--muted); }

/* 控制 */
.controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  border-radius: 10px; padding: 7px 14px; font: 500 13px var(--font-body); cursor: pointer;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
select { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 10px; padding: 6px 8px; font: 13px var(--font-body); }
.hint { font-size: 11.5px; color: var(--muted); flex-basis: 100%; }
.controls:has(.hint:not([hidden])) { flex-wrap: wrap; }

/* 传感器列表 */
/* 两列：左列 = 患者左侧，右列 = 患者右侧；每列从上到下与牙弓上牙齿的前后位置一致 */
.list {
  list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
}
.col-head { padding: 7px 12px; font-size: 11px; color: var(--muted); letter-spacing: .04em; background: var(--app); border-bottom: 1px solid var(--line); }
.col-head + .col-head, .row.r { border-left: 1px solid var(--line); }
.row {
  display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; grid-template-areas: "sw id val" "tooth tooth tooth" "sl sl sl";
  align-items: center; column-gap: 7px; row-gap: 1px; padding: 8px 10px 9px 12px; border-top: 1px solid var(--line); cursor: pointer; min-width: 0;
}
.row.first { border-top: 0; }
.row.sel { background: var(--accent-soft); }
.row .sw { grid-area: sw; width: 12px; height: 12px; border-radius: 50%; }
.row .id { grid-area: id; font: 600 12px var(--font-data); }
.row .tooth { grid-area: tooth; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .tooth span { font-family: var(--font-data); color: var(--muted); margin-right: 4px; }
.row .val { grid-area: val; font: 600 13px var(--font-data); font-variant-numeric: tabular-nums; }
.row .val small { color: var(--muted); font-weight: 400; margin-left: 2px; }
.row input { grid-area: sl; width: 100%; margin: 0; accent-color: var(--accent); }
.row input:disabled { opacity: .55; }
.btn:disabled, select:disabled { opacity: .45; cursor: default; }
.foot { font-size: 11.5px; color: var(--muted); text-align: center; max-width: 390px; }

/* ---------- 单屏布局：所有内容放进一个手机屏幕，热力图占用剩余高度 ---------- */
html, body { height: 100%; }
/* 窗口较矮时手机外框不再被压扁（热力图会被挤没），改为页面滚动 */
.device { flex: none; height: min(830px, max(680px, calc(100vh - 70px))); }
.screen { display: flex; flex-direction: column; overflow: hidden; }
.app { flex: 1 1 auto; min-height: 0; padding: 2px 14px 12px; gap: 8px; }
.head h1 { font-size: 17px; }
.head .sub { font-size: 11px; margin: 0; }
.chip { padding: 3px 9px; font-size: 11px; }
.summary { gap: 6px; }
.stat { padding: 6px 9px; border-radius: 10px; }
.stat .k { font-size: 10.5px; }
.stat .v { font-size: 17px; }
.stat .v.sm { font-size: 13.5px; line-height: 1.55; }
.balance { margin-top: 4px; }
.arch-card { flex: 1 1 0; min-height: 0; padding: 9px 10px 10px; gap: 5px; border-radius: 14px; }
.card-head h2 { font-size: 13px; }
.stage { font-size: 11px; }
svg.arch { flex: 1 1 0; min-height: 0; height: 100%; }
.info { min-height: 0; padding: 5px 9px; font-size: 11.5px; flex-wrap: nowrap; white-space: nowrap; overflow: hidden; }
.info .num { margin-left: auto; }
.scale { gap: 2px; }
.scale .bar { height: 7px; }
.scale .ticks { font-size: 9.5px; }
.controls { gap: 6px; flex-wrap: nowrap; }
.btn { padding: 5px 12px; font-size: 12.5px; border-radius: 9px; }
select { padding: 4px 6px; font-size: 12.5px; border-radius: 9px; }
.col-head { padding: 4px 10px; font-size: 10.5px; }
.row {
  grid-template-columns: 10px auto minmax(0, 1fr) auto; grid-template-areas: "sw id tooth tooth" "sl sl sl val";
  column-gap: 6px; row-gap: 0; padding: 5px 9px 5px 10px;
}
.row .sw { width: 10px; height: 10px; }
.row .id { font-size: 11.5px; }
.row .tooth { font-size: 11.5px; color: var(--muted); }
.row .val { font-size: 12px; min-width: 6.5ch; text-align: right; }
.row input { height: 16px; }
@media (max-width: 559px) {
  body { padding-block: 0; display: block; }
  .device { height: 100%; }
  .screen { height: 100%; overflow: hidden; }
  .app { height: 100%; padding: 10px 0; }
  .foot { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  .dot { animation: none; }
  .balance i { transition: none; }
}
</style>

<div class="device">
  <div class="notch" aria-hidden="true"></div>
  <div class="screen">
    <div class="statusbar" aria-hidden="true">
      <span id="clock">9:41</span>
      <span class="sig"><span id="linkSig">BLE</span> <span class="batt"></span></span>
    </div>

    <main class="app">
      <header class="head">
        <div>
          <h1>咬合力监测</h1>
          <p class="sub">上颌 10 点压力分布</p>
        </div>
        <span class="chip" id="liveChip"><span class="dot"></span><span id="liveText">模拟数据</span></span>
      </header>

      <section class="summary" aria-label="摘要">
        <div class="stat">
          <div class="k" id="totalK">总咬合力</div>
          <div class="v" id="total">0<small>N</small></div>
        </div>
        <div class="stat">
          <div class="k">左 / 右</div>
          <div class="v sm" id="ratio">50 : 50</div>
          <div class="balance" aria-hidden="true"><i id="balL" style="width:50%"></i><i id="balR" style="width:50%"></i></div>
        </div>
        <div class="stat">
          <div class="k">峰值点</div>
          <div class="v sm" id="peak">—</div>
        </div>
      </section>

      <section class="arch-card" aria-label="下颌施力面压力图">
        <div class="card-head">
          <h2>下颌 · 施力面</h2>
          <div class="stage" id="stage">—</div>
        </div>
        <svg class="arch" id="arch" viewBox="0 0 860 610" role="img" aria-label="上颌牙弓与 10 个传感器的压力热点"></svg>
        <div class="info" id="info">点击牙齿上的热点查看该传感器读数</div>
        <div class="scale">
          <div class="bar" id="scaleBar"></div>
          <div class="ticks" id="ticks"><span>0</span><span>25</span><span>50</span><span>75</span><span>100 N</span></div>
        </div>
      </section>

      <section class="controls" aria-label="播放控制">
        <button class="btn primary" id="play" type="button">暂停</button>
        <select id="speed" aria-label="播放速度">
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
        </select>
        <select id="range" title="色标满量程：压降达到该值时显示为最红" aria-label="色标满量程" hidden></select>
        <button class="btn" id="zero" type="button" disabled>全部归零</button>
        <button class="btn" id="connUSB" type="button" title="通过 USB 串口连接 ESP32-S3">USB</button>
        <button class="btn" id="connBLE" type="button" title="通过蓝牙 BLE 连接 ESP32-S3">BLE</button>
        <span class="hint" id="hint" hidden>正在播放模拟咬合循环。暂停后可拖动滑块手动设置每个点的压力。</span>
      </section>

      <ul class="list" id="list" aria-label="传感器读数"></ul>
    </main>
  </div>
</div>
<p class="foot">全屏版见 dashboard_zh.html · 未连接时为模拟数据 · 点击 USB 或 BLE（桌面版 Chrome / Edge）读取 ESP32-S3 实时数据</p>

<script src="hw_link.js"></script>
<script>
(() => {
  const MAX_F = 100; // 模拟数据的色标满量程 (N)
  let FS = MAX_F; // 当前色标满量程：模拟为 MAX_F (N)，实时为 HW.range (压降 %)

  // 压力色标：蓝 → 青 → 绿 → 黄 → 红
  const CMAP = [[0, [39, 71, 201]], [0.25, [31, 169, 214]], [0.5, [54, 191, 91]], [0.75, [242, 204, 42]], [1, [226, 56, 42]]];
  function pressureToColor(value, max = FS, alpha = 1) {
    const p = Math.min(1, Math.max(0, value / max));
    let i = 1;
    while (i < CMAP.length - 1 && p > CMAP[i][0]) i++;
    const [p0, c0] = CMAP[i - 1], [p1, c1] = CMAP[i];
    const t = (p - p0) / (p1 - p0 || 1);
    const c = c0.map((v, k) => Math.round(v + (c1[k] - v) * t));
    return `rgba(${c[0]},${c[1]},${c[2]},${alpha})`;
  }

  // 牙位（FDI 编号个位）与近远中宽度/颊舌径，单位 mm
  const TEETH = [
    { k: 1, name: "中切牙", w: 8.6, d: 7.0, type: "inc" },
    { k: 2, name: "侧切牙", w: 6.6, d: 6.2, type: "inc" },
    { k: 3, name: "尖牙", w: 7.6, d: 8.0, type: "can" },
    { k: 4, name: "第一前磨牙", w: 7.0, d: 9.0, type: "pm" },
    { k: 5, name: "第二前磨牙", w: 6.6, d: 9.0, type: "pm" },
    { k: 6, name: "第一磨牙", w: 10.2, d: 11.0, type: "mol" },
    { k: 7, name: "第二磨牙", w: 9.2, d: 10.6, type: "mol" },
  ];

  // 10 个传感器：沿牙弓顺时针编号 —— 从图左下（右上第二磨牙）经前牙到图右下（左上第二磨牙），Sn 接 GPIOn
  // tooth 为 FDI 牙位号（十位 1 = 右上、2 = 左上；个位 = 从中线往后数第几颗），只在内部用来定位；peak 为模拟峰值力 (N)
  const SENSORS = [
    { id: 1, tooth: 17, peak: 60 }, { id: 2, tooth: 16, peak: 72 }, { id: 3, tooth: 15, peak: 38 }, { id: 4, tooth: 14, peak: 30 }, { id: 5, tooth: 11, peak: 15 },
    { id: 6, tooth: 21, peak: 15 }, { id: 7, tooth: 24, peak: 30 }, { id: 8, tooth: 25, peak: 38 }, { id: 9, tooth: 26, peak: 72 }, { id: 10, tooth: 27, peak: 60 },
  ];
  const toothInfo = (fdi) => TEETH[(fdi % 10) - 1];
  const sideName = (fdi) => (fdi < 20 ? "右上" : "左上");

  // ---------- 牙弓底图 ----------
  // upper_arch.webp 由原图 upper_arch_src.webp (1536×1024) 去白底、裁剪 (110,20)–(1430,910) 并缩放 0.6 得到
  // 14 颗牙在原图中的中心坐标（自动识别），换图后改这里
  const TOOTH_XY = {
    17: [255, 775], 16: [302, 604], 15: [351, 471], 14: [406, 358], 13: [480, 246], 12: [579, 157], 11: [703, 112],
    21: [837, 115], 22: [957, 158], 23: [1054, 247], 24: [1128, 358], 25: [1179, 471], 26: [1231, 603], 27: [1277, 774],
  };
  const IMG = { file: ARCH_IMG, w: 792, h: 534, cropX: 110, cropY: 20, scale: 0.6, x: 34, y: 40 };
  const VB = { w: 860, h: 610 };
  // 底图水平镜像显示：患者右侧在图右、左侧在图左（与面对面观察时相反，便于直观理解）
  const toView = ([x, y]) => [IMG.x + IMG.w - (x - IMG.cropX) * IMG.scale, IMG.y + (y - IMG.cropY) * IMG.scale];
  const ARCH_C = toView([767, 560]); // 牙弓内侧中心，用来确定牙位号朝外的方向
  const toothPos = {};
  for (const [fdi, xy] of Object.entries(TOOTH_XY)) {
    const [x, y] = toView(xy);
    const dx = x - ARCH_C[0], dy = y - ARCH_C[1], l = Math.hypot(dx, dy);
    toothPos[fdi] = { x, y, nx: dx / l, ny: dy / l };
  }

  // ---------- 绘制 SVG ----------
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("arch");
  svg.setAttribute("viewBox", `0 0 ${VB.w} ${VB.h}`);
  const el = (tag, attrs = {}, parent = svg) => {
    const e = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    parent.appendChild(e);
    return e;
  };
  const defs = el("defs");
  el("image", { href: IMG.file, x: IMG.x, y: IMG.y, width: IMG.w, height: IMG.h, transform: `matrix(-1 0 0 1 ${2 * IMG.x + IMG.w} 0)` });

  // 传感器编号，标在对应牙齿外侧
  const labelsG = el("g");
  for (const s of SENSORS) {
    const P = toothPos[s.tooth], k = s.tooth % 10, off = k >= 6 ? 92 : k >= 4 ? 76 : 66;
    el("text", { x: (P.x + P.nx * off).toFixed(1), y: (P.y + P.ny * off + 8).toFixed(1), "text-anchor": "middle", class: "lbl" }, labelsG).textContent = "S" + s.id;
  }
  el("text", { x: 16, y: VB.h - 12, class: "side" }).textContent = "患者左侧";
  el("text", { x: VB.w - 16, y: VB.h - 12, "text-anchor": "end", class: "side" }).textContent = "患者右侧";

  // 传感器热点
  const heat = SENSORS.map((s, i) => {
    const P = toothPos[s.tooth];
    const grad = el("radialGradient", { id: "heat" + i }, defs);
    const stops = [0, 0.38, 0.62, 0.84, 1].map((o) => el("stop", { offset: o }, grad));
    const g = el("g", { class: "sensor", tabindex: 0, role: "button", "aria-label": `S${s.id} ${sideName(s.tooth)}${toothInfo(s.tooth).name}` });
    const ring = el("circle", { cx: P.x, cy: P.y, r: 34, class: "ring" }, g);
    const blob = el("circle", { cx: P.x, cy: P.y, r: 26, fill: `url(#heat${i})` }, g);
    g.addEventListener("click", () => select(i));
    g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(i); } });
    return { g, ring, blob, stops };
  });
  function setHeat(i, v) {
    const p = Math.min(1, Math.max(0, v / FS));
    const h = heat[i];
    // 实心核心 = 当前压力的颜色，向外逐级退到蓝色（同心色环）
    const cols = [pressureToColor(p, 1), pressureToColor(p, 1), pressureToColor(p * 0.55, 1), pressureToColor(p * 0.2, 1, 0.92), pressureToColor(0, 1, 0)];
    h.stops.forEach((st, k) => st.setAttribute("stop-color", cols[k]));
    const r = 26 + 22 * Math.sqrt(p);
    h.blob.setAttribute("r", r.toFixed(2));
    h.ring.setAttribute("r", (r + 9).toFixed(2));
  }

  // 色标条
  document.getElementById("scaleBar").style.background =
    "linear-gradient(90deg," + CMAP.map(([o, c]) => `rgb(${c}) ${o * 100}%`).join(",") + ")";

  // ---------- 传感器列表 ----------
  const list = document.getElementById("list");
  ["患者左侧", "患者右侧"].forEach((txt, c) => {
    const h = document.createElement("li");
    h.className = "col-head";
    h.style.gridColumn = c + 1;
    h.style.gridRow = 1;
    h.textContent = txt;
    list.appendChild(h);
  });
  // 每侧按牙齿在图上的纵向位置（从前牙到后牙）排序，决定所在行
  const rowOf = {};
  [s => s.tooth < 20, s => s.tooth > 20].forEach((side) => {
    SENSORS.filter(side).sort((a, b) => toothPos[a.tooth].y - toothPos[b.tooth].y).forEach((s, k) => (rowOf[s.id] = k));
  });
  const rows = SENSORS.map((s, i) => {
    const li = document.createElement("li");
    const right = s.tooth < 20; // 右列 = 患者右侧
    li.className = "row" + (right ? " r" : "") + (rowOf[s.id] === 0 ? " first" : "");
    li.style.gridColumn = right ? 2 : 1;
    li.style.gridRow = rowOf[s.id] + 2;
    const t = toothInfo(s.tooth);
    li.innerHTML = `<span class="sw"></span><span class="id">S${s.id}</span>
      <span class="tooth">${t.name}</span>
      <span class="val">0.0<small>N</small></span>
      <input type="range" id="slider-s${s.id}" min="0" max="${MAX_F}" step="0.5" value="0" aria-label="S${s.id} 压力" disabled>`;
    li.addEventListener("click", (e) => { if (e.target.tagName !== "INPUT") select(i); });
    const input = li.querySelector("input");
    input.addEventListener("input", () => { manual[i] = +input.value; select(i); });
    list.appendChild(li);
    return { li, sw: li.querySelector(".sw"), val: li.querySelector(".val"), input };
  });

  // ---------- 数据源 ----------
  // 打开页面时不播放模拟数据，点「播放」再开始
  const sim = { t: 0, speed: 1, playing: false, values: SENSORS.map(() => 0), noise: SENSORS.map(() => 0), state: null };
  const manual = SENSORS.map(() => 0);
  const PERIOD = 2.8; // 一次咬合循环 (s)
  const PATTERN = [
    { label: "双侧均衡", r: 1, l: 1 },
    { label: "右侧偏咬", r: 1.35, l: 0.55 },
    { label: "双侧均衡", r: 1, l: 1 },
    { label: "左侧偏咬", r: 0.55, l: 1.35 },
  ];
  const smooth = (x) => x * x * (3 - 2 * x);
  function envelope(ph) {
    if (ph < 0.3) return smooth(ph / 0.3);
    if (ph < 0.58) return 1;
    if (ph < 0.8) return 1 - smooth((ph - 0.58) / 0.22);
    return 0;
  }
  function simStep(dt) {
    sim.t += dt * sim.speed;
    const cyc = Math.floor(sim.t / PERIOD), ph = (sim.t % PERIOD) / PERIOD;
    const pat = PATTERN[cyc % PATTERN.length], e = envelope(ph);
    SENSORS.forEach((s, i) => {
      sim.noise[i] = sim.noise[i] * 0.9 + (Math.random() - 0.5) * 0.9;
      const front = s.tooth % 10 <= 2;
      const f = front ? 1 : s.tooth < 20 ? pat.r : pat.l;
      const v = s.peak * e * f * (1 + 0.04 * Math.sin(sim.t * 6 + i)) + sim.noise[i] * 2 * e;
      sim.values[i] = Math.min(MAX_F, Math.max(0, v));
    });
    const stage = ph < 0.3 ? "咬紧" : ph < 0.58 ? "保持" : ph < 0.8 ? "放松" : "张口";
    sim.state = { cyc: cyc + 1, label: pat.label, stage };
  }

  // 10 个传感器的数值：已连接时为各路分压的压降百分比 (hw_link.js)，否则为模拟压力 (N)
  function getPressures() {
    if (HW.connected) return HW.values();
    return sim.playing ? sim.values : manual;
  }

  // ---------- 渲染 ----------
  let selected = 1; // 默认选中 S2（右上第一磨牙）
  const $ = (id) => document.getElementById(id);
  function select(i) { selected = i; }
  function render() {
    const v = getPressures(), live = HW.connected, volts = live ? HW.volts() : null;
    FS = live ? HW.range : MAX_F;
    const total = v.reduce((a, b) => a + b, 0);
    let right = 0, left = 0, pk = 0;
    v.forEach((x, i) => {
      SENSORS[i].tooth < 20 ? (right += x) : (left += x);
      if (x > v[pk]) pk = i;
      setHeat(i, x);
      const col = pressureToColor(x);
      rows[i].sw.style.background = col;
      rows[i].val.firstChild.nodeValue = live ? (HW.ready ? volts[i].toFixed(3) : "—") : x.toFixed(1); // 收到第一帧前不显示电压
      rows[i].val.lastChild.textContent = live ? "V" : "N";
      if (sim.playing || HW.connected) rows[i].input.value = x;
      rows[i].li.classList.toggle("sel", i === selected);
      heat[i].g.classList.toggle("sel", i === selected);
    });
    $("total").firstChild.nodeValue = total.toFixed(0);
    $("total").lastChild.textContent = live ? "%" : "N";
    const rp = total > 0.5 ? Math.round((right / total) * 100) : 50;
    $("ratio").textContent = `${100 - rp} : ${rp}`; // 与屏幕方向一致：左 : 右
    $("balR").style.width = rp + "%";
    $("balL").style.width = 100 - rp + "%";
    $("peak").textContent = v[pk] > 0.5 ? `S${SENSORS[pk].id}` : "—";

    if (HW.connected) {
      $("stage").innerHTML = HW.fps ? `<b>实时 · ${HW.mode}</b> · ${HW.fps} Hz` : `<b>${HW.mode}</b> · 等待数据`;
    } else if (sim.playing && sim.state) {
      $("stage").innerHTML = `第 ${sim.state.cyc} 次 · <b>${sim.state.label}</b> · ${sim.state.stage}`;
    } else {
      $("stage").innerHTML = "<b>手动设置</b>";
    }
    const s = SENSORS[selected], x = v[selected];
    const share = total > 0.5 ? ((x / total) * 100).toFixed(0) + "%" : "—";
    $("info").innerHTML =
      `<span class="sw" style="width:10px;height:10px;border-radius:50%;background:${pressureToColor(x)}"></span>` +
      `<b>S${s.id} · ${sideName(s.tooth)}${toothInfo(s.tooth).name}</b>` +
      `<span class="num">${live ? (HW.ready ? `${volts[selected].toFixed(3)} V · ${x.toFixed(1)} %` : "—") : `${x.toFixed(1)} N`}</span><span>占总力 ${share}</span>`;
  }

  // ---------- 控制 ----------
  function setPlaying(on) {
    if (!on) SENSORS.forEach((_, i) => { manual[i] = Math.round(sim.values[i] * 2) / 2; rows[i].input.value = manual[i]; });
    sim.playing = on;
    updateControls();
  }
  // 根据当前数据源（实时硬件 / 模拟 / 手动滑块）设置控件状态和文字
  function updateControls() {
    const live = HW.connected, on = sim.playing;
    $("play").textContent = on ? "暂停" : "播放";
    $("play").disabled = $("speed").disabled = live;
    $("zero").textContent = live ? "调零" : "全部归零";
    $("zero").disabled = !live && on;
    rows.forEach((r) => (r.input.disabled = live || on));
    $("connUSB").textContent = live && HW.mode === "USB" ? "断开" : "USB";
    $("connBLE").textContent = live && HW.mode === "BLE" ? "断开" : "BLE";
    $("connUSB").disabled = !HW.supportsSerial || (live && HW.mode !== "USB");
    $("connBLE").disabled = !HW.supportsBLE || (live && HW.mode !== "BLE");
    $("totalK").textContent = live ? "总压降" : "总咬合力";
    const fs = live ? HW.range : MAX_F;
    $("ticks").querySelectorAll("span").forEach((e, k) => (e.textContent = +((fs * k) / 4).toFixed(1) + (k === 4 ? (live ? " %" : " N") : "")));
    $("speed").hidden = live;
    $("range").hidden = !live;
    $("range").value = HW.range;
    $("linkSig").textContent = live ? HW.mode : "未连接";
    $("liveChip").classList.toggle("paused", live ? !HW.fps : !on);
    $("liveText").textContent = live ? `实时 · ${HW.mode} · ${HW.fps} Hz` : on ? "模拟数据" : "已暂停";
    $("hint").hidden = !HW.error;
    $("hint").textContent = HW.error || (live
      ? "ESP32-S3 实时分压读数（电压越低压力越大）。传感器不受力时点击「调零」。"
      : on
        ? "正在播放模拟咬合循环。暂停后可拖动滑块手动设置每个点的压力，或通过 USB / BLE 连接硬件。"
        : "模拟已停止：点「播放」演示咬合循环，或拖动下方滑块设置各点压力，也可通过 USB / BLE 连接硬件。");
  }
  $("play").addEventListener("click", () => setPlaying(!sim.playing));
  $("speed").addEventListener("change", (e) => (sim.speed = +e.target.value));
  // 实时模式的色标满量程：压降达到该值显示为最红
  HW.ranges.forEach((r) => $("range").add(new Option(`≤ ${r} %`, r)));
  $("range").addEventListener("change", (e) => HW.setRange(e.target.value));
  $("zero").addEventListener("click", () => {
    if (HW.connected) HW.tare();
    else SENSORS.forEach((_, i) => { manual[i] = 0; rows[i].input.value = 0; });
  });
  $("connUSB").addEventListener("click", () => (HW.connected ? HW.disconnect() : HW.connectSerial()));
  $("connBLE").addEventListener("click", () => (HW.connected ? HW.disconnect() : HW.connectBLE()));
  HW.on(updateControls);

  function tickClock() {
    const d = new Date();
    $("clock").textContent = d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0");
  }
  tickClock();
  setInterval(tickClock, 15000);

  // 模拟先推进到一次咬合的保持阶段，点「播放」后立即有颜色
  simStep(PERIOD * 0.42);
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (sim.playing) simStep(dt);
    render();
    requestAnimationFrame(loop);
  }
  render();
  requestAnimationFrame(loop);
})();
</script>
